version: "3.8"

services:
  orbital-drift-serving:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: orbital-drift:latest
    container_name: orbital-drift-serving
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ORBITAL_DRIFT_SERVE_DEVICE matches OrbitalDriftConfig.serve_device
      # (env_prefix "ORBITAL_DRIFT_" + field name "SERVE_DEVICE") -- verified
      # correct as-is, RB-010 Part 5.
      - ORBITAL_DRIFT_SERVE_DEVICE=cpu
      # Renamed from ORBITAL_DRIFT_SERVE_PORT (RB-010 Part 5): the config
      # field is `serving_port`, not `serve_port`, so pydantic-settings with
      # env_prefix "ORBITAL_DRIFT_" only ever read ORBITAL_DRIFT_SERVING_PORT
      # -- the old name was silently ignored. D-015/D-03 unifies the
      # number at 8000 (config.serving_port, EXPOSE, compose, wrapper).
      - ORBITAL_DRIFT_SERVING_PORT=8000
      - ORBITAL_DRIFT_SERVE_HOST=0.0.0.0
      - ORBITAL_DRIFT_CANARY_RATIO=0.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - tile_store_data:/app/data

volumes:
  tile_store_data:
    driver: local
