version: "3.8"

services:
  orbital-drift-serving:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: orbital-drift:latest
    container_name: orbital-drift-serving
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ORBITAL_DRIFT_SERVE_DEVICE=cpu
      - ORBITAL_DRIFT_SERVE_PORT=8000
      - ORBITAL_DRIFT_SERVE_HOST=0.0.0.0
      - ORBITAL_DRIFT_CANARY_RATIO=0.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - tile_store_data:/app/data

volumes:
  tile_store_data:
    driver: local
