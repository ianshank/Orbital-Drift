# =============================================================================
# Orbital-Drift — project + tooling configuration
#
# Python 3.12 per specs/001-orbital-drift-ct/plan.md (Technical Context).
#
# RUNTIME DEPENDENCIES WERE EMPTY UNTIL RB-009 AND THAT WAS A DEFECT, NOT A
# POLICY. The original header said they were "deliberately EMPTY at T001"
# because "torch/torchgeo/mlflow/lakefs-client land with the tasks that first
# import them". Those tasks landed (PR #16) and the declarations did not. The
# result: `pip install -e ".[dev]"` -- the ONE documented bootstrap command
# (README.md, Principle IV) and the command CI itself runs -- produced a tree in
# which 7 of 17 modules under src/orbital_drift raised ModuleNotFoundError on
# import, and six of fourteen CI gates were red on main
# (run 32660872598: contract, coverage, hooks, traceability, typecheck, unit).
# An undeclared import is not a deferred decision, it is a broken install.
#
# The declarations below are therefore organised as CORE + ADAPTER EXTRAS, which
# is the dependency-graph expression of the ports-and-adapters boundary:
# `dependencies` is what the configuration spine needs to exist at all, and each
# extra is one adapter's third-party surface. `orbital_drift.quality.dep_contract`
# reconciles this table against the imports actually present in src/ on every
# run of the `deps` gate, so this class of defect cannot recur silently.
#
# Every pin below was verified against a live index; see
# docs/decisions/versions.md for the platform-side pins and the pinning
# protocol (Constitution IV). Gate-TOOL pins live in ci/versions.env; runtime
# LIBRARY pins live here only, because ci/checks.sh derives its preflight tool
# list from that file's `<NAME>_VERSION` keys and would try to probe
# `numpy --version` as if it were an executable.
# =============================================================================

[build-system]
# Pinned like every other tool (Constitution IV). `pip install -e ".[dev]"` —
# the one documented bootstrap command, and now the command CI runs too —
# resolves this in an isolated PEP 517 build environment, so an unpinned backend
# would be a floating dependency of every install anyone ever makes of this
# project. Mirrored in ci/versions.env HATCHLING_VERSION with its provenance
# URL; tests/unit/test_version_pins.py asserts the two agree.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "orbital-drift"
version = "0.0.0"
description = "Self-retraining Sentinel-2 change-detection pipeline on k3s"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# CORE: what the configuration spine needs to exist at all. Nothing in this
# package can be constructed without a validated config, so these are not
# optional the way an adapter's client library is. Deliberately small.
dependencies = [
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
# --- ADAPTER EXTRAS -----------------------------------------------------------
# One extra per adapter surface. A module that imports one of these libraries
# belongs to that adapter and is declared here, never in `dependencies`, so the
# domain layer's independence from frameworks is visible in the dependency graph
# and not merely asserted in prose. `[tool.orbital_drift.dependency_contract]`
# below maps modules to extras and the `deps` gate enforces the mapping.

# STAC catalogue + tile store I/O.
ingest = [
  "requests==2.34.2",
  "numpy==2.5.2",
]

# PSI / KS drift metrics. scipy supplies ks_2samp; nothing bespoke (Principle II).
drift = [
  "numpy==2.5.2",
  "scipy==1.18.1",
]

# Promotion-gate statistics. esda supplies Moran's I and its permutation
# inference (PySAL, the reference implementation); scikit-learn supplies
# average_precision_score and calibration_curve. Principle II requires that
# drift and eval use standard, widely recognised methods from off-the-shelf
# libraries -- so these are dependencies, not code to be written.
evaluation = [
  "numpy==2.5.2",
  "scipy==1.18.1",
  "scikit-learn==1.9.0",
  "esda==2.10.0",
  "libpysal==4.15.0",
]

# FastAPI serving adapter.
serve = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "numpy==2.5.2",
]

# Torch training adapter. Pinned by VERSION only, never by local version
# segment: `torch==2.13.0` matches `2.13.0+cpu` and `2.13.0+cu###` alike
# (PEP 440 ignores an unspecified local segment), so one pin serves the CPU
# integration runner and the dual-GPU host. WHICH build gets installed is an
# environment fact, not a package version, and lives in ci/versions.env as
# TORCH_CPU_INDEX_URL for CI and in the host-prep runbook for node A.
train = [
  "torch==2.13.0",
  "numpy==2.5.2",
]

# --- DEVELOPMENT / GATE TOOLING ----------------------------------------------
# Installed by ci/checks.sh and by the pre-commit hooks' own isolated envs.
# Tool pins keep lockstep with ci/versions.env and .pre-commit-config.yaml revs
# (tests/unit/test_version_pins.py asserts it mechanically).
#
# The adapter extras are RESTATED here rather than self-referenced as
# `orbital-drift[ingest,drift,...]` for a mechanical reason: every `[dev]` entry
# must be pinned with `==` or tests/unit/test_version_pins.py fails, and a
# self-reference carries no version. tests/unit/test_dependency_contract.py
# asserts `[dev]` is a superset of every adapter extra at identical versions, so
# the restatement cannot drift from the extras it mirrors.
dev = [
  "ruff==0.16.2",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "coverage==7.15.4",
  "pre-commit==4.6.1",
  # adopt-governance-kit gate tools (design D3); mirrored in ci/versions.env
  # with provenance URLs, asserted by tests/unit/test_version_pins.py.
  "vulture==2.16",
  "pip-audit==2.10.1",
  # Boundary enforcement (RB-009). Mechanically verifies the ports-and-adapters
  # hexagon via .importlinter contracts; the same rule is independently
  # re-derived from the AST by tests/architecture/test_import_boundaries.py,
  # because a linter nobody wired into CI enforces nothing.
  "import-linter==2.13",
  # Property-based testing for the canonical-hash and round-trip invariants,
  # where example-based tests cannot cover the input space that matters.
  "hypothesis==6.165.10",
  # requests ships no inline annotations; mypy runs strict with
  # ignore_missing_imports = false, so the stubs are a hard requirement.
  "types-requests==2.32.4.20250913",
  # starlette's TestClient -- which fastapi.testclient re-exports and which
  # tests/contract/test_serving.py and tests/unit/test_serving_edge_cases.py
  # both import -- raises RuntimeError at import time without this. It is a
  # TEST-ONLY dependency of the serve adapter, so it belongs in [dev] and NOT
  # in the `serve` extra: a production deployment must not carry a test client.
  # This is precisely the case the `deps` gate is built to catch, and it does:
  # dep_contract classifies imports reached only from tests/ as dev-scoped.
  "httpx2==2.12.0",
  # Adapter extras, restated (see note above).
  "requests==2.34.2",
  "numpy==2.5.2",
  "scipy==1.18.1",
  "scikit-learn==1.9.0",
  "esda==2.10.0",
  "libpysal==4.15.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "torch==2.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orbital_drift"]

# -----------------------------------------------------------------------------
# ruff — lint + format
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
# `tests/unit` is listed so isort classifies `shell_harness` — the sibling
# helper module that runs ci/checks.sh under stubs — as first-party. It is not
# a package (no __init__.py) because pytest and mypy both resolve sibling
# modules by directory, and adding one would put `tests` on the import path as
# a distributable name.
src = ["src", "tests", "tests/unit"]
extend-exclude = [".terraform", "infra/**/*.tf"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "PTH",  # flake8-use-pathlib
  "ARG",  # unused arguments
  "ANN",  # missing type annotations (feeds mypy strict)
  "S",    # flake8-bandit — secrets/subprocess hygiene (Principle VII)
  "T20",  # no print() — structured logging only
  "TID",  # tidy imports
  "RUF",  # ruff-specific
]
ignore = [
  "ANN401",  # allow typing.Any where a boundary genuinely is dynamic
]

[tool.ruff.lint.per-file-ignores]
# roadmap_data.py is a record-per-line data module (design D9): each Epic/Story
# literal stays on one line so a backlog change is a one-line diff, and its
# strings are CSV-projected DATA, not code. Wrapping them to 100 columns would
# trade diffability for nothing — E501 is ignored here and nowhere else in src.
"src/orbital_drift/planning/roadmap_data.py" = ["E501"]
"scripts/setup_gpu_env.py" = ["T201", "S603"]
"tests/**/*.py" = [
  "S101",  # assert is the point of a test
  # The behavioural tests RUN ci/checks.sh (with git/docker/python stubbed on
  # PATH), run pre-commit to enumerate the hooks that really execute, and run
  # the pinned gitleaks container against planted secrets. Executing those
  # commands is the mechanism, not a risk: every argv is a fixed list built from
  # repository paths and `shutil.which` results, never from test input. Scoped
  # to tests/ so production code keeps the check. Ignored here rather than with
  # `# noqa`, because a per-file-ignore makes the rule non-enabled for the file
  # and an inline suppression would then trip RUF100.
  "S603",  # subprocess call: check for execution of untrusted input
]

[tool.ruff.lint.isort]
known-first-party = ["orbital_drift"]

[tool.ruff.format]
docstring-code-format = true

# -----------------------------------------------------------------------------
# mypy — type check
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
# Third-party geospatial/ML packages ship incomplete stubs; loosen per-module
# in Phase 1+ with an explicit [[tool.mypy.overrides]] block and a reason,
# never globally.
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
  "torch.*",
  "torch",
  "torchvision.*",
  "torchvision",
  "numpy.*",
  "numpy",
  "scipy.*",
  "scipy",
  "fastapi.*",
  "fastapi",
  "starlette.*",
  "pydantic.*",
  "pydantic",
  "pydantic_settings.*",
  "pydantic_settings",
  "sklearn.*",
  "sklearn",
  "esda.*",
  "esda",
  "libpysal.*",
  "libpysal",
]
ignore_missing_imports = true

# NOTE: there is deliberately NO [tool.coverage.*] section here. The FR-011a
# global coverage floor is owned entirely by ci/checks.sh's stage_coverage,
# which passes `--cov=src/orbital_drift --cov-fail-under=${COVERAGE_MIN_PERCENT}`
# (ci/versions.env) explicitly on its pytest command line — nothing here can
# silently redefine what that gate measures.
# tests/unit/test_ci_contract.py::
# test_no_coverage_config_silently_redefines_what_the_gate_measures hard-fails
# if any `[tool.coverage]` key reappears; see docs/decisions/001-coverage-gate.md.
# The per-file floor (charter C-6, DEC-004) is a separate, additive check —
# orbital_drift.covcheck, run by stage_coverage immediately after the global
# floor passes — and its bar lives in ci/versions.env too, as
# COVERAGE_PER_FILE_MIN_PERCENT, passed on covcheck's command line as `--floor`
# (RB-008 F4). covcheck.PER_FILE_FLOOR is only the fallback for a hand-run of
# the module, held equal to the pin by tests/unit/test_covcheck.py. Neither bar
# is a pyproject knob.

# -----------------------------------------------------------------------------
# vulture — dead-code scan (adopt-governance-kit design D3)
# -----------------------------------------------------------------------------
[tool.vulture]
# src AND tests. The original comment claimed the test suite produced "too many
# confident-looking false positives to gate on"; measured at this floor it
# produces exactly zero, and tests/ is where dead scaffolding actually
# accumulates (shell_harness.py alone is 560+ lines). A justification that
# measurement contradicts is worse than no justification.
#
# scripts/ is out of scope for a real reason: those are .sh files, linted by
# the pinned shellcheck container instead (.pre-commit-config.yaml).
paths = ["src", "tests"]
min_confidence = 80

# -----------------------------------------------------------------------------
# Governance (adopt-governance-kit): the governed-path globs are read by BOTH
# tests/governance/test_governance_meta.py and scripts/pre_push_scan.sh — one
# home, so the test and the hook cannot hold different invariants.
# -----------------------------------------------------------------------------
[tool.orbital_drift.governance]
governed_path_globs = [
  "src/**",
  "dags/**",
  "workflows/**",
  "infra/**",
  "ci/**",
  "scripts/**",
  ".github/**",
  ".claude/**",
  ".specify/**",
  "dashboards/**",
  "docs/runbooks/**",
  "docs/decision-log.md",
  "charter/**",
  "openspec/**",
  "specs/**",
  "traceability/**",
  "planning/**",
  "tests/**",
]

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
# src layout is importable without an editable install, so `pytest` works on a
# clean checkout and inside a CI container with no build step.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "contract: pipeline-boundary contract test (Constitution V)",
  "smoke: DAG/workflow import + structural smoke test",
]

[tool.orbital_drift.architecture]
domain_packages = ["orbital_drift.domain", "orbital_drift.ports"]
forbidden_third_party = [
  "numpy",
  "scipy",
  "torch",
  "pydantic",
  "pydantic_settings",
  "sklearn.*",
  "sklearn",
  "esda.*",
  "esda",
  "libpysal.*",
  "libpysal",
  "requests",
  "fastapi",
]
