# =============================================================================
# Orbital-Drift CI — thin caller only.
#
# The gates themselves live in ci/checks.sh (plan.md puts "pipeline defs,
# gitleaks config" under ci/). This file's only jobs are: provision a runner,
# install pinned tools, and invoke `sh ci/checks.sh <stage>`. Do not add gate
# logic here — it would immediately diverge from what runs locally and on node A.
#
# That rule was previously broken: this file inlined a `gitleaks git .` full-
# history scan as a raw `docker run`, so a secret in an older commit was
# invisible to every local check while CI claimed to be reproducible. The
# history scan now lives in `ci/checks.sh gitleaks` alongside the working-tree
# scan, and this file just calls it.
#
# BOOTSTRAP: every job installs with `python -m pip install -e ".[dev]"` —
# the exact command README.md documents as the single Principle IV command
# path. It previously installed four distributions by name instead, so CI never
# once executed the documented bootstrap: a broken build backend, a malformed
# [project] table or a bad `requires-python` would have been invisible here and
# surfaced first on node A. The two now meet. hatchling, the PEP 517 backend
# that command resolves, is pinned in pyproject.toml [build-system].requires and
# in ci/versions.env like everything else.
#
# EVERYTHING MUTABLE IS PINNED, including the installer. Action versions are
# pinned to a commit SHA, because a tag like `@v7` is mutable and a supply-chain
# rewrite of it would silently run in a workflow that has repository read
# access. The runner label is pinned for the same reason (`ubuntu-latest` is
# mutable), the gitleaks and shellcheck images are pinned by digest rather than
# tag for the same reason again, and `pip` itself is pinned to
# ci/versions.env PIP_VERSION — this file used to run a bare
# `pip install --upgrade pip`, an unpinned upgrade to a moving target executed
# immediately before the step that installs every other pin.
#
# ...AND AN ACTION PIN HAS A FRESHNESS MECHANISM. A SHA pin is immutable in
# both directions: it also cannot notice it has gone stale. `.github/dependabot.yml`
# proposes action bumps weekly and rewrites the trailing `# vX.Y.Z` comment
# alongside the SHA, so that comment stays honest rather than decorative.
# Pinning without a freshness mechanism is not safety, it is a deferred
# decision.
#
# NOT YET COVERED: the pinned PYTHON dependencies. pip-audit runs in the
# `audit` stage, but only on push/PR — so it re-audits unchanged versions and
# stays green for exactly as long as nobody touches the repo, which is the
# window in which an advisory lands unnoticed. The weekly `schedule:` trigger
# that closes this runs on refs/heads/main and would share the concurrency
# group below with a main push; it therefore lands together with the
# `cancel-in-progress` fix, in the gate-integrity change that owns that line
# (RB-008 part 1, deferral recorded in RB-008a). Do not add it here alone.
#
# CACHING. `~/.cache/pip` comes from actions/setup-python; `~/.cache/pre-commit`
# is cached explicitly, keyed on the hash of .pre-commit-config.yaml, because a
# cold pre-commit cache clones three hook repositories and builds three
# virtualenvs on every run. The `unit` stage needs it too: one of its tests
# enumerates the hooks that actually execute at --hook-stage manual by running
# pre-commit, which is the only way to see the MERGED hook definition.
#
# TIMEOUTS. Every job carries `timeout-minutes`. The default is 360, so a hung
# `docker pull` against a rate-limited registry sat there for six hours.
#
# FORBIDDEN in this file: `continue-on-error`, `|| true`, `if: always()` on a
# gate step. A gate that cannot fail the build is not a gate (Constitution V).
#
# STAGE COVERAGE: the matrix below plus the `gitleaks` and `hooks` jobs must
# together cover every label in ci/checks.sh's dispatch `case`.
# tests/unit/test_ci_contract.py asserts that, so a stage added to stage_all
# cannot silently never run here.
# =============================================================================

name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  # WEEKLY, BECAUSE ONE GATE IS NOT A PURE FUNCTION OF THE TREE. `audit`
  # (pip-audit) resolves the pinned dependency set against a LIVE advisory
  # database, so a CVE published today against a dependency pinned last month
  # makes this repository vulnerable with no diff, no push and nothing red
  # anywhere — the gate that would catch it simply never runs. Every other stage
  # is decided entirely by the checkout and needs no timer.
  #
  # COUPLED TO THE WHOLE `concurrency:` BLOCK BELOW — DO NOT SEPARATE THEM.
  # A scheduled run fires on refs/heads/main, so under the ref-keyed group this
  # file used to carry it joined the SAME concurrency group as every push to
  # main. That made it a recurring, unattended canceller of main's own run —
  # directly under the old `cancel-in-progress: true` (it cancels the run in
  # progress), and STILL indirectly with cancellation disabled, because a run
  # queued into an occupied group goes pending and a pending run is cancelled by
  # the next arrival. Either way the casualty is the gitleaks full-history scan
  # that run 32575049407 (commit 4a76930) already lost once, silently, because
  # `cancelled` is not `failure`.
  #
  # The trigger is therefore safe because of BOTH keys below — per-commit
  # grouping for non-PR events AND pull_request-only cancellation — not either
  # alone. tests/unit/test_ci_contract.py's
  # test_a_scheduled_run_can_never_cancel_a_push_to_main asserts both, so the
  # timer cannot outlive them by a later edit or by merge order.
  #
  # KNOWN RESIDUAL, DELIBERATELY NOT FIXED HERE — the timer is now subject to a
  # weaker form of the same blindness this block is about, with the roles
  # reversed. Per-commit grouping puts a scheduled run on sha X in the SAME
  # group as the push run for X. If that push run is still in progress the
  # scheduled run goes pending, and a third arrival on X — a re-run, or a
  # `workflow_dispatch` — cancels it. The casualty is then `audit`, which is the
  # one gate this timer exists to run, and a cancelled scheduled run reports
  # `cancelled` rather than `failure`, so nothing surfaces the skipped week.
  #
  # Why it is a residual and not a defect in this change: the gate-integrity
  # property is about MAIN's own runs, and those are never the casualty — a
  # scheduled run cannot cancel a run that is in progress, and the commit that
  # landed on main keeps its completed gitleaks full-history scan either way.
  # The loss is one week of advisory-database freshness, recoverable by a manual
  # `workflow_dispatch` and bounded by the next Monday. Fixing it properly means
  # giving scheduled runs a group of their own (or none), which changes the
  # grouping rule this PR exists to pin and belongs in its own change with its
  # own tests — not smuggled in beside the fix it would modify.
  schedule:
    # Mondays 06:17 UTC. Deliberately off the hour: GitHub queues scheduled runs
    # and drops them under load, which is worst at :00.
    #
    # This literal is NOT in ci/versions.env, unlike CI_RUNNER_IMAGE, and the
    # reason is mechanical rather than a preference: GitHub evaluates no
    # expressions in the `on:` block, so the trick that keeps `runs-on` pinned
    # (read the value at run time from a job output) has no equivalent here — a
    # `${{ }}` cron is a parse error, not a cadence. Its SHAPE is asserted
    # instead, by test_the_workflow_runs_on_a_schedule: one entry, fixed minute
    # and hour, every day-of-month and month, one fixed weekday. That is what
    # stops `* * * * *` from passing for "a schedule exists".
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A RUN OF MAIN MUST NEVER BE CANCELLED, AND THAT TAKES BOTH KEYS BELOW — this
# is a gate-integrity rule, not a cost one.
#
# The incident: run 32575049407 (push, main, head 4a76930, run #56) was
# cancelled 43 seconds in, superseded by run #57, so that merge commit carries
# no completed gitleaks full-history scan anywhere. GitHub records `cancelled`,
# which is not `failure` — no red X, no required-check breach, nothing for an
# operator to skim past — so Constitution VII ("a red gitleaks halts
# everything") was silently unenforceable for it.
#
# `cancel-in-progress: false` DOES NOT CLOSE THAT ON ITS OWN. Per GitHub's
# documented concurrency behaviour, a run queued into a group that already holds
# one becomes PENDING, and a previously pending run in that group is cancelled
# when a newer one arrives; `cancel-in-progress` governs only the IN-PROGRESS
# run. With a single ref-keyed group for main, two merges landing while a run
# holds the group — up to 25 minutes, the `hooks` job timeout — would leave the
# FIRST merge's run cancelled while pending. Same incident, different door, and
# the weekly `schedule:` trigger above would hold that group open on a timer.
#
# So non-PR events are grouped PER COMMIT and a push to main contends with
# nothing. Pull requests keep ref-keyed grouping AND cancellation, which is the
# case where superseding is wanted: the newer head gets a complete run of its
# own, a PR cannot merge on a cancelled check, and without it every intermediate
# commit burns a full matrix.
#
# Both keys are asserted by tests/unit/test_ci_contract.py's
# test_a_push_to_main_shares_no_concurrency_group_and_is_never_cancelled, and
# the grouping half again by the schedule-coupling test beside it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the pinned tool versions once and hand them to every other job.
  #
  # This job's own `runs-on` is the single unavoidable literal: it has to boot
  # before it can read CI_RUNNER_IMAGE. tests/unit/test_version_pins.py asserts
  # the literal below equals ci/versions.env CI_RUNNER_IMAGE.
  # ---------------------------------------------------------------------------
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.read.outputs.CI_RUNNER_IMAGE }}
      python: ${{ steps.read.outputs.PYTHON_VERSION }}
      pip: ${{ steps.read.outputs.PIP_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read ci/versions.env
        id: read
        run: grep -E '^[A-Z0-9_]+=' ci/versions.env >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # lint | type-check | unit | contract | smoke   (FR-011, Constitution V)
  # plus coverage                                 (FR-011a)
  # One matrix entry per stage so a failure names the gate that broke.
  #
  # `coverage` re-runs tests/unit under measurement, so this matrix executes that
  # suite twice. In a matrix the two run in PARALLEL JOBS, so wall-clock is
  # roughly unchanged and the cost is one extra runner — unlike a local
  # `sh ci/checks.sh all`, where the same duplication is serial. Deliberate: see
  # docs/decisions/001-coverage-gate.md D-06 for the cheaper designs and which
  # gate each of them weakens.
  #
  # Every stage runs ci/checks.sh's preflight for the pins IT executes, which
  # fails closed if the installed versions differ — so the install step below
  # cannot silently under-deliver.
  # ---------------------------------------------------------------------------
  python-gates:
    needs: versions
    runs-on: ${{ needs.versions.outputs.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stage: [lint, typecheck, unit, contract, smoke, coverage, dead, audit, specs, traceability, projections, governance, deps, architecture]
    name: ${{ matrix.stage }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ needs.versions.outputs.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.versions.outputs.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # tests/unit enumerates the hooks that run at --hook-stage manual by
      # running pre-commit (the only way to observe the MERGED definition), so
      # the unit stage wants this cache as much as the hooks job does.
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ needs.versions.outputs.python }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Bootstrap (the command README.md documents)
        run: |
          python -m pip install --upgrade "pip==${{ needs.versions.outputs.pip }}"
          python -m pip install -e ".[dev]"

      - name: Run stage
        run: sh ci/checks.sh "${{ matrix.stage }}"

  # ---------------------------------------------------------------------------
  # gitleaks (Constitution VII). Separate job: it needs full history, which the
  # Python gates do not, and a red result here halts everything.
  #
  # `fetch-depth: 0` matters, and so does the ABSENCE of `filter:`. A shallow
  # clone makes the history scan see almost nothing and pass vacuously; a
  # partial (blobless) clone does the same while `--is-shallow-repository` still
  # reports false. `ci/checks.sh` refuses to run on either rather than trusting
  # this block, but the block still has to be right or the job fails every run.
  #
  # NO PYTHON HERE, deliberately. `ci/checks.sh gitleaks` needs Docker and git
  # and nothing else: it runs a pinned container and asserts that container's
  # version itself. Installing the Python toolchain would make the secrets gate
  # fail on a PyPI outage or a yanked build backend — a job named `gitleaks`
  # going red for a reason that has nothing to do with secrets is how an
  # operator learns to skim past it.
  # ---------------------------------------------------------------------------
  gitleaks:
    needs: versions
    runs-on: ${{ needs.versions.outputs.runner }}
    timeout-minutes: 15
    name: gitleaks
    steps:
      - name: Checkout (full history, unfiltered)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan working tree and full history
        run: sh ci/checks.sh gitleaks

  # ---------------------------------------------------------------------------
  # pre-commit hooks. Without this job the hook set is enforced only where
  # somebody ran `pre-commit install`, and one `git commit --no-verify` bypasses
  # detect-private-key, check-added-large-files, mixed-line-ending and the
  # check-yaml/toml/json hooks with CI still green.
  #
  # check-added-large-files carries `--enforce-all` for exactly that claim to be
  # true: without it the hook only inspects files staged as added, of which a
  # clean checkout has none, so it checked nothing and reported Passed.
  #
  # Not one of FR-011's six gates; it enforces the config those gates assume.
  # ---------------------------------------------------------------------------
  hooks:
    needs: versions
    runs-on: ${{ needs.versions.outputs.runner }}
    timeout-minutes: 25
    name: hooks
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ needs.versions.outputs.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.versions.outputs.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ needs.versions.outputs.python }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Bootstrap (the command README.md documents)
        run: |
          python -m pip install --upgrade "pip==${{ needs.versions.outputs.pip }}"
          python -m pip install -e ".[dev]"

      - name: Run stage
        run: sh ci/checks.sh hooks
